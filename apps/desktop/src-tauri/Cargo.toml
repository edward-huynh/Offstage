[package]
name = "offstage-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "offstage_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio-util = "0.7"
offstage-core.workspace = true
offstage-audio = { path = "../../../crates/audio" }
offstage-llm = { path = "../../../crates/llm" }
offstage-models = { path = "../../../crates/models" }
offstage-pipeline = { path = "../../../crates/pipeline" }
# whisper.cpp is built from source, so the build needs cmake and a C++ toolchain.
offstage-stt = { path = "../../../crates/stt", features = ["whisper"] }

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Reads and requests the microphone permission through AVFoundation. The system audio
# permission has no public way to be checked ahead of time.
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
# Runs the model on the Apple GPU.
offstage-stt = { path = "../../../crates/stt", features = ["metal"] }
