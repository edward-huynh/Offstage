[package]
name = "offstage-llm-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runs a local language model for Offstage in its own process (llama.cpp)"

[dependencies]
offstage-llm-proto = { path = "../../crates/llm-proto" }
# llama.cpp is built from source, so the build needs cmake and a C++ toolchain, like whisper.cpp.
llama-cpp-2 = "0.1.160"

[target.'cfg(target_os = "macos")'.dependencies]
# Runs the model on the Apple GPU.
llama-cpp-2 = { version = "0.1.160", features = ["metal"] }

[features]
# Runs the model on a Vulkan GPU (Windows and Linux). Off by default, because it cannot be tried
# on the CI runner or here: building it needs the Vulkan SDK (`VULKAN_SDK` set), and the program
# then links `vulkan-1.dll`, so a computer without a Vulkan driver cannot start it at all.
# Build with `OFFSTAGE_LLM_FEATURES=vulkan npm run build` (see docs/RELEASE.md).
vulkan = ["llama-cpp-2/vulkan"]
