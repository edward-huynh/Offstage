[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri", "apps/llm-host"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/edward-huynh/Offstage"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
offstage-core = { path = "crates/core" }

# Release builds: strip the symbols, which takes about a quarter off the binary (CLAUDE.md has
# the numbers). Not `lto = "fat"`: it fails to link ONNX Runtime on macOS (`___isPlatformVersionAtLeast`
# is undefined) and saves only 1 MB on the sidecar. `panic` stays at "unwind": the PDF reader
# catches a panic on a damaged file instead of crashing the app.
[profile.release]
strip = true
